name: CI

on:
  push:
    branches: [master, main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails loudly if package-lock.json drifts from package.json.
      - run: npm ci --no-audit --no-fund

      # A redundant or unused export fails the build by design.
      - name: Dead-export scan
        run: npm run scan:dead

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Protocol harness self-test
        run: python test_external_app.py --selftest

  rust:
    name: Rust gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The frontend bundle is embedded into the binary, so it must exist first.
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: >
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --all-targets --features custom-protocol -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features custom-protocol
