[package]
name = "desktop-pet-host"
version = "2.0.0"
description = "Multi-format (2D/Live2D/Spine/VRM) micro-kernel desktop pet host built with Tauri v2"
authors = ["DesktopPetHost Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[features]
# Without this feature Tauri serves the window from `build.devUrl`, so a release
# binary built by plain `cargo build --release` points at the Vite dev server and
# renders "connection refused" once no dev server is running. `tauri build` enables
# it automatically; enabling it explicitly keeps `cargo build --release` shippable too.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "tray-icon", "unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
notify = "6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi"
] }
