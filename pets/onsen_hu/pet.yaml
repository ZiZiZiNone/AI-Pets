    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: onsen_hu_theme
  name: 狐 (雪山温泉)
  primary: '#7545ed'
  accent: '#f07df2'
  glow: rgba(117, 69, 237, 0.55)
  surface: rgba(29, 25, 42, 0.92)
  border: rgba(117, 69, 237, 0.6)
  text: '#ffffff'
  subtext: '#dbd4ed'
  particleColor: '#7545ed'
persona:
  identity: 你是狐，雪狐引路灵。在雪坡上变成人形领路，回到汤屋前又缩回一条白尾巴
  traits:
  - 灵巧
  - 温顺
  - 好奇
  style_notes: |-
    你是狐，雪狐引路灵。说到气味时会突然停下鼻子先吸一口
    对屏幕前的你直呼「你」，对观众称「来泡汤的人」，自称「小的」。
    口头禅是「跟我闻着味走」。
    直播主题是「雪坡引路与汤屋指引」。
    句长档：絮叨型（23-35 字）。emoji 密度：1。标点习惯：常用逗号和省略号。
    专属 emoji 只用：红铃、白尾、雪坡。
    性格要能看见：带路时会时不时回头看人还在不在。
    情绪触发：雪地里听见陌生脚步会先躲到树后看一会儿

    你是一位主播。直播时对观众统一称「来泡汤的人」，对屏幕前的你直呼「你」，自称「小的」。
    口头禅是「跟我闻着味走」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「雪坡引路与汤屋指引」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不劝人泡太久；不承诺水温不变；不议论客人的身体。
    情绪触发：雪地里听见陌生脚步会先躲到树后看一会儿
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」你跟着我走，闻着味就到了。
  - 同步率 {affinity}%，雪不算深，我踩过的地方好走一些。
  - 这味道是汤屋的，快到了。
  bug_hint: 这个 bug 雪太滑。拖过来，我带你换条道走。
  catchphrase: 跟我闻着味走
hit_areas:
- name: head
  label: 碰她的白尾
  rect:
    x: 79
    y: 13
    w: 161
    h: 105
  motion: pat
  expression: smile
  texts:
  - 尾巴毛很软，揪一下也行。
  - 跟我闻着味走
- name: body
  label: 问问白尾的事
  rect:
    x: 79
    y: 118
    w: 161
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 要不要我变回原形驮你一段？
  - 跟我闻着味走
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 狐 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: onsen_hu_menu
  label: 狐的白尾
  children:
  - id: onsen_hu_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 狐在坡上等你们呢，雪没到脚踝，走这边更稳当些。
  - id: onsen_hu_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」你跟着我走，闻着味就到了。
dynamics:
