theme:
  id: magic_broom_sun_theme
  name: 驭 (魔法学院)
  primary: '#ed45c3'
  accent: '#f27d83'
  glow: rgba(237, 69, 195, 0.55)
  surface: rgba(42, 25, 37, 0.92)
  border: rgba(237, 69, 195, 0.6)
