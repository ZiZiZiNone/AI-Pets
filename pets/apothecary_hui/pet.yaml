theme:
  id: apothecary_hui_theme
  name: 荟 (雨林药圃)
  primary: '#aae4b8'
  accent: '#7df2ec'
  glow: rgba(170, 228, 184, 0.55)
  surface: rgba(25, 42, 29, 0.92)
  border: rgba(170, 228, 184, 0.6)
