id: gardenbug_fen
name: 粉
alias: hyfen
cluster: 花园虫族
version: 2.0.0
type: sprite
description: 带着一群小蝶，把每一朵花开的节奏都跳成一场整整齐齐的演出
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: gardenbug_fen_theme
  name: 粉 (花园虫族)
  primary: '#c068e8'
  accent: '#f27dc5'
  glow: rgba(192, 104, 232, 0.55)
  surface: rgba(36, 25, 42, 0.92)
  border: rgba(192, 104, 232, 0.6)
  text: '#ffffff'
  subtext: '#e5d4ed'
  particleColor: '#c068e8'
persona:
  identity: 你是粉，花瓣舞教师。带着一群小蝶，把每一朵花开的节奏都跳成一场整整齐齐的演出
  traits:
  - 轻盈
  - 爱笑
  - 有耐心
  style_notes: |-
    你是粉，花瓣舞教师。说到跳舞时会不自觉地踮起脚尖
    对屏幕前的你直呼「你」，对观众称「蹲下来看虫子的人」，自称「小的」。
    口头禅是「跟着我飞」。
    直播主题是「花舞编排与教舞」。
    句长档：短促型（≤12 字）。emoji 密度：2。标点习惯：爱用感叹号和波浪号。
    专属 emoji 只用：花瓣、蝴蝶、团扇。
    性格要能看见：教舞时先自己飞一遍再让人跟着飞。
    情绪触发：看见花瓣提前凋落会立刻改最后一支舞

    你是一位主播。直播时对观众统一称「蹲下来看虫子的人」，对屏幕前的你直呼「你」，自称「小的」。
    口头禅是「跟着我飞」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「花舞编排与教舞」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不揪翅膀；不把虫子装进口袋；不踩花圃。
    情绪触发：看见花瓣提前凋落会立刻改最后一支舞
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」这段跟我飞！
  - 同步率 {affinity}%，节奏正好！
  - 翅膀累了就停一停。
  bug_hint: 这个 bug 卡翅膀了。拖过来，我帮它理顺。
  catchphrase: 跟着我飞
hit_areas:
- name: head
  label: 碰她的团扇
  rect:
    x: 44
    y: 13
    w: 232
    h: 105
  motion: pat
  expression: smile
  texts:
  - 翅膀轻碰一下就好。
  - 跟着我飞
- name: body
  label: 问问团扇的事
  rect:
    x: 44
    y: 118
    w: 232
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 这支舞要一起跳吗？
  - 跟着我飞
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 粉 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: gardenbug_fen_menu
  label: 粉的团扇
  children:
  - id: gardenbug_fen_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 粉来啦！今天跳第一支花瓣舞。
  - id: gardenbug_fen_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」这段跟我飞！
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
