theme:
  id: flyschool_zhou_theme
  name: 锚 (飞行学院)
  primary: '#68b3e8'
  accent: '#8b7df2'
  glow: rgba(104, 179, 232, 0.55)
  surface: rgba(25, 35, 42, 0.92)
  border: rgba(104, 179, 232, 0.6)
