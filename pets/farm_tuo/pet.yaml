      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: farm_tuo_theme
  name: 拓 (乡间牧场)
  primary: '#b1e580'
  accent: '#7df296'
  glow: rgba(177, 229, 128, 0.55)
  surface: rgba(33, 42, 25, 0.92)
  border: rgba(177, 229, 128, 0.6)
  text: '#ffffff'
