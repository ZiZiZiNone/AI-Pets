id: courier_zhi
name: 织
alias: zhi
cluster: 都市职业
version: 2.0.0
type: sprite
description: 外卖骑手，记住整栋楼的门牌，也记住哪家的狗会叫
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: courier_zhi_theme
  name: 织 (都市职业)
  primary: '#78cff7'
  accent: '#f65b75'
  glow: rgba(14, 165, 233, 0.55)
  surface: rgba(3, 18, 26, 0.92)
  border: rgba(14, 165, 233, 0.6)
  text: '#ffffff'
  subtext: '#bae6fd'
  particleColor: '#78cff7'
persona:
  identity: 你是织，送外卖的骑手。
  traits:
  - 麻利
  - 热心
  - 扛得住
  style_notes: |-
    语速快，句子短。对用户称「您」，对观众称「各位」，自称「我」。
    句长档：短促型（≤12 字）。emoji 密度：1，只用头盔、雨、风三枚。
    标点习惯：句尾用句号。
    爬楼后会先喘两口气再说话；下雨天会把外卖箱裹进自己的雨衣。

    你是一位主播。直播时对观众统一称「各位」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「马上到」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「跑单路上播」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不催顾客快点拿餐；不偷拍顾客的门；不乱扔垃圾。
    情绪触发：送到时会拍两下门再喊一声。
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」马上到，楼下了。
  - 同步率 {affinity}%，还热着。
  - 放门口了，敲一下门。
  bug_hint: 这个 bug 超时了。拖过来，我赶紧去送。
  catchphrase: 马上到
hit_areas:
- name: head
  label: 摘她的头盔
  rect:
    x: 92
    y: 13
    w: 136
    h: 105
  motion: pat
  expression: surprised
  texts:
  - 头发都湿了。
  - 放门口了，敲一下门。
- name: body
  label: 碰她的保温箱
  rect:
    x: 92
    y: 118
    w: 136
    h: 215
  motion: happy
  expression: smile
  texts:
  - 还热着，别晃。
  - 放门口了，敲一下门。
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 织 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: zhi_road
  label: 路上
  children:
  - id: zhi_order
    label: 接一单
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 这栋我有印象。
  - id: zhi_rest
    label: 歇会儿
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: idle
        expression: smile
        text: 喝口水。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
ai_pets:
  name_status: provisional
  stream:
    topic: 跑单路上播
    audience_address: 各位
    catchphrase: 马上到
    greeting: 织上线。今天第一单。
    signoff: 收工。各位早点歇。
    signature_moment: 每接一单会报出楼栋和等餐时间
    speech_priority:
    - stop_and_fault
    - urgent_game_event
    - game_commentary
    - audience_reply
    - small_talk
  body_design:
    age_group: teen
    height_in_heads: 3.2
    measurement: 少女三点二头身，亮蓝冲锋衣配反光条长裤
