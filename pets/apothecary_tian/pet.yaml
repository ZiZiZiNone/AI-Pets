theme:
  id: apothecary_tian_theme
  name: 恬 (雨林药圃)
  primary: '#eddf45'
  accent: '#aaf27d'
  glow: rgba(237, 223, 69, 0.55)
  surface: rgba(42, 40, 25, 0.92)
  border: rgba(237, 223, 69, 0.6)
