<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340">
  <defs>
    <radialGradient id="bodyGrad" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#8ec5fc" />
      <stop offset="55%" stop-color="#6a85f1" />
      <stop offset="100%" stop-color="#4e54c8" />
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8da1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff8da1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0c3fc" />
      <stop offset="100%" stop-color="#8ec5fc" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="160" cy="306" rx="68" ry="14" fill="#0f172a" opacity="0.22" />

  <!-- Floating star antenna -->
  <g filter="url(#softShadow)">
    <path d="M160 68 Q160 40 176 28" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" fill="none" />
    <circle cx="180" cy="24" r="9" fill="#fde047" />
    <circle cx="180" cy="24" r="4" fill="#fef9c3" />
  </g>

  <!-- Cute cyber ears -->
  <g filter="url(#softShadow)">
    <path d="M95 105 L64 48 L128 78 Z" fill="url(#earGrad)" stroke="#4e54c8" stroke-width="3" stroke-linejoin="round" />
    <path d="M88 94 L72 60 L114 80 Z" fill="#f472b6" opacity="0.65" />
    <path d="M225 105 L256 48 L192 78 Z" fill="url(#earGrad)" stroke="#4e54c8" stroke-width="3" stroke-linejoin="round" />
    <path d="M232 94 L248 60 L206 80 Z" fill="#f472b6" opacity="0.65" />
  </g>

  <!-- Main rounded body -->
  <g filter="url(#softShadow)">
    <path d="M82 175 C82 102, 112 66, 160 66 C208 66, 238 102, 238 175 C238 242, 212 286, 160 286 C108 286, 82 242, 82 175 Z"
          fill="url(#bodyGrad)" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Belly patch -->
  <ellipse cx="160" cy="222" rx="46" ry="42" fill="#ffffff" opacity="0.88" />
  <!-- Core emblem on belly -->
  <path d="M160 202 L170 218 L160 234 L150 218 Z" fill="#6366f1" opacity="0.85" />
  <circle cx="160" cy="218" r="4" fill="#a5f3fc" />

  <!-- Face visor / screen -->
  <rect x="98" y="104" width="124" height="72" rx="34" ry="34" fill="url(#visorGrad)" stroke="#c7d2fe" stroke-width="3" />

  <!-- Glowing cyber eyes -->
  <g>
    <!-- Left eye -->
    <ellipse cx="132" cy="138" rx="11" ry="14" fill="#38bdf8" />
    <circle cx="128" cy="132" r="4.5" fill="#ffffff" />
    <circle cx="136" cy="144" r="2" fill="#bae6fd" />

    <!-- Right eye -->
    <ellipse cx="188" cy="138" rx="11" ry="14" fill="#38bdf8" />
    <circle cx="184" cy="132" r="4.5" fill="#ffffff" />
    <circle cx="192" cy="144" r="2" fill="#bae6fd" />
  </g>

  <!-- Blush cheeks -->
  <ellipse cx="112" cy="154" rx="12" ry="7" fill="url(#cheekGrad)" />
  <ellipse cx="208" cy="154" rx="12" ry="7" fill="url(#cheekGrad)" />

  <!-- Cat-like happy mouth (:3) -->
  <path d="M149 152 Q154.5 158 160 152 Q165.5 158 171 152" stroke="#f472b6" stroke-width="3.2" stroke-linecap="round" fill="none" />

  <!-- Cute side paws / arms -->
  <ellipse cx="76" cy="196" rx="16" ry="24" transform="rotate(22 76 196)" fill="#8ec5fc" stroke="#ffffff" stroke-width="3" />
  <ellipse cx="244" cy="196" rx="16" ry="24" transform="rotate(-22 244 196)" fill="#8ec5fc" stroke="#ffffff" stroke-width="3" />

  <!-- Feet -->
  <ellipse cx="126" cy="286" rx="22" ry="12" fill="#4e54c8" stroke="#ffffff" stroke-width="3" />
  <ellipse cx="194" cy="286" rx="22" ry="12" fill="#4e54c8" stroke="#ffffff" stroke-width="3" />
</svg>
