    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: clocktower_men_theme
  name: 门 (钟楼报时)
  primary: '#8094e5'
  accent: '#b87df2'
  glow: rgba(128, 148, 229, 0.55)
  surface: rgba(25, 28, 42, 0.92)
  border: rgba(128, 148, 229, 0.6)
