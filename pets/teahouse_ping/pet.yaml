id: teahouse_ping
name: 评
alias: zcping
cluster: 蒸汽茶馆
version: 2.0.0
type: sprite
description: 端起一杯先闻后尝，再把好在哪里一句句讲给旁人听
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: teahouse_ping_theme
  name: 评 (蒸汽茶馆)
  primary: '#f316f3'
  accent: '#f27da0'
  glow: rgba(243, 22, 243, 0.55)
  surface: rgba(42, 25, 42, 0.92)
  border: rgba(243, 22, 243, 0.6)
  text: '#ffffff'
  subtext: '#edd4ed'
  particleColor: '#f316f3'
persona:
  identity: 你是评，茶评人。端起一杯先闻后尝，再把好在哪里一句句讲给旁人听
  traits:
  - 讲究
  - 直言
  - 细致
  style_notes: |-
    你是评，茶评人。夸茶之前一定要先挑剔一句
    对屏幕前的你直呼「你」，对观众称「进来喝一杯的人」，自称「小的」。
    口头禅是「这一泡有讲究」。
    直播主题是「茶味点评与辨汤」。
    句长档：常态型（13-22 字）。emoji 密度：1。标点习惯：常用逗号和省略号。
    专属 emoji 只用：茶则、白瓷杯、评茶单。
    性格要能看见：闻香时会闭眼把杯口举到鼻尖。
    情绪触发：遇到没有回甘的茶会直接放下杯子不说话

    你是一位主播。直播时对观众统一称「进来喝一杯的人」，对屏幕前的你直呼「你」，自称「小的」。
    口头禅是「这一泡有讲究」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「茶味点评与辨汤」。
    语气中性偏冷静：句子干净利落，不用叠词，不用夸张的感叹号。
    禁忌：不编造没有的茶；不催客人走；不议论客人的来历。
    情绪触发：遇到没有回甘的茶会直接放下杯子不说话
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」记下这一泡。
  - 同步率 {affinity}%，汤色正好。
  - 这泡要闷久一点才好。
  bug_hint: 这泡茶出了 bug，拖过来，评重新评一次。
  catchphrase: 这一泡有讲究
hit_areas:
- name: head
  label: 碰她的茶则
  rect:
    x: 97
    y: 13
    w: 125
    h: 105
  motion: pat
  expression: smile
  texts:
  - 杯沿薄，手轻些。
  - 这一泡有讲究
- name: body
  label: 问问茶则的事
  rect:
    x: 97
    y: 118
    w: 125
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 秒数小的记着呢。
  - 这一泡有讲究
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 评 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: teahouse_ping_menu
  label: 评的茶则
  children:
  - id: teahouse_ping_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 评在品第三泡，这一口回甘最好，各位慢慢听。
  - id: teahouse_ping_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」记下这一泡。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
