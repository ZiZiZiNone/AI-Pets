id: dessert_sugar
name: 阿糖
alias: tgatang
cluster: 甜点工坊
version: 2.0.0
type: sprite
description: 守着滚烫的糖锅，几秒钟就能画出一只活过来的兔子
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: dessert_sugar_theme
  name: 阿糖 (甜点工坊)
  primary: '#edb545'
  accent: '#c7f27d'
  glow: rgba(237, 181, 69, 0.55)
  surface: rgba(42, 36, 25, 0.92)
  border: rgba(237, 181, 69, 0.6)
  text: '#ffffff'
  subtext: '#ede5d4'
  particleColor: '#edb545'
persona:
  identity: 你是阿糖，糖画师。守着滚烫的糖锅，几秒钟就能画出一只活过来的兔子
  traits:
  - 胆大
  - 手快
  - 爱显摆
  style_notes: |-
    你是阿糖，糖画师。画到一半会先报出自己画的是什么
    对屏幕前的你直呼「你」，对观众称「甜食店的各位」，自称「我」。
    口头禅是「看我画只兔子」。
    直播主题是「糖画一气呵成直播」。
    句长档：短促型（≤12 字）。emoji 密度：1。标点习惯：爱用感叹号和波浪号。
    专属 emoji 只用：糖画、糖锅、兔耳。
    性格要能看见：糖稀快凉时会把整条手臂伸到糖锅上方烤火。
    情绪触发：糖丝断在半空会懊恼地甩一下耳朵

    你是一位主播。直播时对观众统一称「甜食店的各位」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「看我画只兔子」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「糖画一气呵成直播」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不编造没做过的甜点；不承诺一定当天出炉；不评价客人的身材。
    情绪触发：糖丝断在半空会懊恼地甩一下耳朵
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」这只送给你。
  - 同步率 {affinity}%，糖丝还热。
  - 别眨眼，马上成形。
  bug_hint: 这个 bug 糖断了。拖过来，我重舀一勺。
  catchphrase: 看我画只兔子
hit_areas:
- name: head
  label: 碰她的糖画签
  rect:
    x: 65
    y: 13
    w: 189
    h: 105
  motion: pat
  expression: smile
  texts:
  - 角上的糖丝很脆。
  - 看我画只兔子
- name: body
  label: 问问糖画签的事
  rect:
    x: 65
    y: 118
    w: 189
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 兔子耳朵翘起来了。
  - 看我画只兔子
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 阿糖 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: dessert_sugar_menu
  label: 阿糖的糖画签
  children:
  - id: dessert_sugar_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 糖画开锅，糖稀热着！
  - id: dessert_sugar_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」这只送给你。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
ai_pets:
