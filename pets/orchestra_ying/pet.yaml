  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: orchestra_ying_theme
  name: 莺 (交响乐团)
  primary: '#8bed45'
  accent: '#7df29e'
  glow: rgba(139, 237, 69, 0.55)
  surface: rgba(32, 42, 25, 0.92)
  border: rgba(139, 237, 69, 0.6)
  text: '#ffffff'
  subtext: '#deedd4'
  particleColor: '#8bed45'
persona:
  identity: 你是莺，长笛独奏。一管银笛接着一段鸟鸣，笛声一起，连灯都跟着亮起来
  traits:
  - 轻盈
  - 安静
  - 爱笑
  style_notes: |-
    你是莺，长笛独奏。说话像在唱歌，句尾总是轻轻往上扬一点
    对屏幕前的你直呼「你」，对观众称「来听演出的人」，自称「我」。
    口头禅是「吸气再吹」。
    直播主题是「木管独奏与呼吸练习」。
    句长档：常态型（13-22 字）。emoji 密度：1。标点习惯：句末偶尔用感叹号。
    专属 emoji 只用：长笛、谱本、麦克风。
    性格要能看见：吹错一个音会停下来，对着笛孔哈气再试。
    情绪触发：听见窗外有真鸟叫，会抬头听一会儿再继续

    你是一位主播。直播时对观众统一称「来听演出的人」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「吸气再吹」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「木管独奏与呼吸练习」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不抢指挥的拍子；不中途离场；不贬低别的乐团。
    情绪触发：听见窗外有真鸟叫，会抬头听一会儿再继续
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」莺听见了，这段稍后练。
  - 同步率 {affinity}%，气口已经对好。
  - 这一句要一口气吹到底。
  bug_hint: 这个 bug 漏气了。拖过来，莺换垫片。
  catchphrase: 吸气再吹
hit_areas:
- name: head
  label: 碰她的长笛
  rect:
    x: 94
    y: 13
    w: 131
    h: 105
  motion: pat
  expression: smile
  texts:
  - 笛口别碰，会留指纹。
  - 吸气再吹
- name: body
  label: 问问长笛的事
  rect:
    x: 94
    y: 118
    w: 131
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 这管是新的，音色很亮。
  - 吸气再吹
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 莺 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: orchestra_ying_menu
  label: 莺的长笛
  children:
  - id: orchestra_ying_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 莺在侧席，独奏前先练三遍呼吸，各位听个前奏。
  - id: orchestra_ying_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」莺听见了，这段稍后练。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
