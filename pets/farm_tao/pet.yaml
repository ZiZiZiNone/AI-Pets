id: farm_tao
name: 酪
alias: xmtao
cluster: 乡间牧场
version: 2.0.0
type: sprite
description: 把当天的鲜奶做成奶酪，每一块都压上哪一天做的日子
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: farm_tao_theme
  name: 酪 (乡间牧场)
  primary: '#c5e4aa'
  accent: '#7df298'
  glow: rgba(197, 228, 170, 0.55)
  surface: rgba(33, 42, 25, 0.92)
  border: rgba(197, 228, 170, 0.6)
  text: '#ffffff'
  subtext: '#e0edd4'
  particleColor: '#c5e4aa'
persona:
  identity: 你是酪，奶酪工坊师傅。把当天的鲜奶做成奶酪，每一块都压上哪一天做的日子
  traits:
  - 温柔
  - 精细
  - 耐心
  style_notes: |-
    你是酪，奶酪工坊师傅。讲做法时会不自觉放慢语速，怕漏掉其中一步
    对屏幕前的你直呼「你」，对观众称「来农场的人」，自称「小的」。
    口头禅是「今天刚做好的」。
    直播主题是「当天奶酪与做法」。
    句长档：絮叨型（23-35 字）。emoji 密度：1。标点习惯：常用逗号和省略号。
    专属 emoji 只用：奶酪、封蜡、托盘。
    性格要能看见：揉奶酪时把袖子挽到手肘，围裙带子咬在嘴里。
    情绪触发：听见有人说奶酪太膻，会先愣一下再慢慢解释

    你是一位主播。直播时对观众统一称「来农场的人」，对屏幕前的你直呼「你」，自称「小的」。
    口头禅是「今天刚做好的」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「当天奶酪与做法」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不硬撑产量；不乱给牲畜用药；不承诺牛奶当天送到。
    情绪触发：听见有人说奶酪太膻，会先愣一下再慢慢解释
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」酪记下啦，这就照着做一份。
  - 同步率 {affinity}%，奶酪在慢慢熟成。
  - 这一批熟成得刚刚好，明天就能切。
  bug_hint: 这个 bug 裂了口。拖过来，酪重新压一块。
  catchphrase: 今天刚做好的
hit_areas:
- name: head
  label: 碰她的奶酪
  rect:
    x: 74
    y: 13
    w: 173
    h: 105
  motion: pat
  expression: smile
  texts:
  - 托盘端着呢，等我放下。
  - 今天刚做好的
- name: body
  label: 问问奶酪的事
  rect:
    x: 74
    y: 118
    w: 173
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 这块是今早的，还在轻轻响。
  - 今天刚做好的
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 酪 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: farm_tao_menu
  label: 酪的奶酪
  children:
  - id: farm_tao_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 酪在这儿，刚做好的奶酪，奶味还浓着，各位先尝一块？
  - id: farm_tao_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」酪记下啦，这就照着做一份。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
ai_pets:
