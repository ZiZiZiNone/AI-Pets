  name_status: provisional
  stream:
    topic: 街坊旧书收售直播
    audience_address: 来淘书的人
    catchphrase: 这批我全收
    greeting: 箧刚收完一车书，今晚开箱。
    signoff: 书装箱了。各位也早点歇。
