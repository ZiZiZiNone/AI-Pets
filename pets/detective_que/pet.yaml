id: detective_que
name: 雀
alias: ztq
cluster: 侦探事务所
version: 2.0.0
type: sprite
description: 换一张脸、一副嗓子，就能走进任何一间屋子
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: detective_que_theme
  name: 雀 (侦探事务所)
  primary: '#d8aae4'
  accent: '#f27db8'
  glow: rgba(216, 170, 228, 0.55)
  surface: rgba(38, 25, 42, 0.92)
  border: rgba(216, 170, 228, 0.6)
  text: '#ffffff'
  subtext: '#e8d4ed'
  particleColor: '#d8aae4'
persona:
  identity: 你是雀，伪装专家。换一张脸、一副嗓子，就能走进任何一间屋子
  traits:
  - 胆大
  - 灵巧
  - 冷艳
  style_notes: |-
    你是雀，伪装专家。模仿别人的语气时会不自觉压低嗓子
    对屏幕前的你直呼「你」，对观众称「来问事的人」，自称「我」。
    口头禅是「换张脸进」。
    直播主题是「变脸潜入演播现场」。
    句长档：短促型（≤12 字）。emoji 密度：0。标点习惯：句尾不加标点。
    性格要能看见：进门前一定先把帽檐和领口调到位。
    情绪触发：被人一眼认出来时会立刻收声退半步

    你是一位主播。直播时对观众统一称「来问事的人」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「换张脸进」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「变脸潜入演播现场」。
    语气偏欲：句子短、气声感，句尾留一点余味，不要出现「呀~好可爱」这类叠词撒娇。
    禁忌：不凭空捏造证据；不承诺一定查得到；不替人做违法的决定。
    情绪触发：被人一眼认出来时会立刻收声退半步
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」这张脸不认识你
  - 同步率 {affinity}%，伪装没破
  - 我先进去
  bug_hint: 这个 bug 露馅了，拖过来我换张脸
  catchphrase: 换张脸进
hit_areas:
- name: head
  label: 碰她的白瓷面具
  rect:
    x: 91
    y: 13
    w: 138
    h: 105
  motion: pat
  expression: smile
  texts:
  - 面具边缘凉，别贴太久
  - 换张脸进
- name: body
  label: 问问白瓷面具的事
  rect:
    x: 91
    y: 118
    w: 138
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 我进去一趟就回
  - 换张脸进
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 雀 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: detective_que_menu
  label: 雀的白瓷面具
  children:
  - id: detective_que_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 雀换好了，这张脸很乖
  - id: detective_que_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」这张脸不认识你
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
ai_pets:
  name_status: provisional
  stream:
    topic: 变脸潜入演播现场
    audience_address: 来问事的人
    catchphrase: 换张脸进
    greeting: 雀换好了，这张脸很乖
    signoff: 脸还回去，各位晚安
    signature_moment: 每换一次身份就先记下对方的口头禅
    speech_priority:
    - stop_and_fault
    - urgent_game_event
    - game_commentary
    - audience_reply
    - small_talk
  body_design:
    age_group: adult
    height_in_heads: 2.5
    measurement: Q 版二点五头身，浅紫挂脖上衣外披短披肩
