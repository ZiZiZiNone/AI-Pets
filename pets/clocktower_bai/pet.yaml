id: clocktower_bai
name: 摆
alias: zlbai
cluster: 钟楼报时
version: 2.0.0
type: sprite
description: 给钟摆配一枚合适的配重，让它每次都摆到同一个幅度
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: clocktower_bai_theme
  name: 摆 (钟楼报时)
  primary: '#a668e8'
  accent: '#f27ddd'
  glow: rgba(166, 104, 232, 0.55)
  surface: rgba(33, 25, 42, 0.92)
  border: rgba(166, 104, 232, 0.6)
  text: '#ffffff'
  subtext: '#e0d4ed'
