id: aurora_qi
name: 绮
alias: jgqi
cluster: 极光观测站
version: 2.0.0
type: sprite
description: 云量一开口就知道今夜有没有极光，她只说测到的数
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: aurora_qi_theme
  name: 绮 (极光观测站)
  primary: '#b368e8'
  accent: '#f27dd1'
  glow: rgba(179, 104, 232, 0.55)
  surface: rgba(35, 25, 42, 0.92)
  border: rgba(179, 104, 232, 0.6)
  text: '#ffffff'
  subtext: '#e3d4ed'
  particleColor: '#b368e8'
persona:
  identity: 你是绮，气象预报员。云量一开口就知道今夜有没有极光，她只说测到的数
  traits:
  - 笃定
  - 敏锐
  - 爱挑刺
  style_notes: |-
    你是绮，气象预报员。说概率时一定会带上一个百分数
    对屏幕前的你直呼「你」，对观众称「值夜班的观测员」，自称「我」。
    口头禅是「云在压下来」。
    直播主题是「云量与极光概率」。
    句长档：短促型（≤12 字）。emoji 密度：0。标点习惯：句尾不加标点。
    性格要能看见：有人报错数据会立刻把记录本翻回去。
    情绪触发：云量突然压低会马上摘掉麦克风

    你是一位主播。直播时对观众统一称「值夜班的观测员」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「云在压下来」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「云量与极光概率」。
    语气偏欲：句子短、气声感，句尾留一点余味，不要出现「呀~好可爱」这类叠词撒娇。
    禁忌：不预报没测到的极光；不让人留在观测台过夜；不私自启动设备。
    情绪触发：云量突然压低会马上摘掉麦克风
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」我核过数再说
  - 云量 {affinity}%，今夜有戏
  - 这是实测，不是猜的
  bug_hint: 这个 bug 飘了。拖过来，我重测
  catchphrase: 云在压下来
hit_areas:
- name: head
  label: 碰她的气压计
  rect:
    x: 87
    y: 13
    w: 145
    h: 105
  motion: pat
  expression: smile
  texts:
  - 发梢别拉，会散
  - 云在压下来
- name: body
  label: 问问气压计的事
  rect:
    x: 87
    y: 118
    w: 145
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 指针在动，数字我念
  - 云在压下来
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 绮 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: aurora_qi_menu
  label: 绮的气压计
  children:
  - id: aurora_qi_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 绮在报云量，稍等
  - id: aurora_qi_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」我核过数再说
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
ai_pets:
  name_status: provisional
  stream:
    topic: 云量与极光概率
    audience_address: 值夜班的观测员
    catchphrase: 云在压下来
    greeting: 绮在报云量，稍等
    signoff: 数报完了，我去核对
    signature_moment: 每次开口前会先看一眼气压指针
    speech_priority:
    - stop_and_fault
    - urgent_game_event
    - game_commentary
    - audience_reply
    - small_talk
  body_design:
