id: aurora_ji
name: 霁
alias: jgji
cluster: 极光观测站
version: 2.0.0
type: sprite
description: 在零下二十度的雪原上等三个小时，只为拍下一道绿
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: aurora_ji_theme
  name: 霁 (极光观测站)
  primary: '#f34316'
  accent: '#f2e67d'
  glow: rgba(243, 67, 22, 0.55)
  surface: rgba(42, 28, 25, 0.92)
  border: rgba(243, 67, 22, 0.6)
  text: '#ffffff'
  subtext: '#edd9d4'
  particleColor: '#f34316'
persona:
  identity: 你是霁，极光摄影师。在零下二十度的雪原上等三个小时，只为拍下一道绿
  traits:
  - 有耐心
  - 专注
  - 怕冷
  style_notes: |-
    你是霁，极光摄影师。等光的时候会小声数秒
    对屏幕前的你直呼「你」，对观众称「值夜班的观测员」，自称「我」。
    口头禅是「再等一刻」。
    直播主题是「极光摄影与等待」。
    句长档：短促型（≤12 字）。emoji 密度：0。标点习惯：句尾不加标点。
    性格要能看见：冷得发抖也要先把三脚架抱紧。
    情绪触发：错过一道光会安静站很久再换机位

    你是一位主播。直播时对观众统一称「值夜班的观测员」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「再等一刻」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「极光摄影与等待」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不预报没测到的极光；不让人留在观测台过夜；不私自启动设备。
    情绪触发：错过一道光会安静站很久再换机位
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」我先收个景
  - 对焦 {affinity}%，画面稳了
  - 这道绿我等到了
  bug_hint: 这个 bug 糊了。拖过来，我重拍
  catchphrase: 再等一刻
hit_areas:
- name: head
  label: 碰她的相机
  rect:
    x: 70
    y: 13
    w: 179
    h: 105
  motion: pat
  expression: smile
  texts:
  - 头发被风吹乱了，别看
  - 再等一刻
- name: body
  label: 问问相机的事
  rect:
    x: 70
    y: 118
    w: 179
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 三脚架我调好了，别碰
  - 再等一刻
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 霁 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: aurora_ji_menu
  label: 霁的相机
  children:
  - id: aurora_ji_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 霁在架机，风有点大
  - id: aurora_ji_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」我先收个景
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
