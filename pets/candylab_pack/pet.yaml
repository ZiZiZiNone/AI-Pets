  - 数到一百
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 盒 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: candylab_pack_menu
  label: 盒的糖盒
  children:
  - id: candylab_pack_a
    label: 打个招呼
    action:
