id: "pulse_glitch_phantom"
name: "PULSE 赛博故障幽灵"
version: "2.0.0"
type: "sprite"
description: "高街怪诞波普与 RGB 故障色散风格的数字幽灵，内置声波锯齿律动"

model:
  entry: "idle.svg"
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: "idle.svg"
      loop: true
    happy:
      file: "idle.svg"
      loop: false
      duration_ms: 2200
    pat:
      file: "idle.svg"
      loop: false
      duration_ms: 1800
    feed:
      file: "idle.svg"
      loop: false
      duration_ms: 2400
    drag:
      file: "idle.svg"
      loop: true
    climb:
      file: "idle.svg"
      loop: true
    sleep:
      file: "idle.svg"
      loop: true

expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfef08a
  surprised:
    tint: 0x67e8f9
  sleepy:
    tint: 0xf472b6

hit_areas:
  - name: "head"
    label: "触碰霓虹皇冠"
    rect:
      x: 80
      y: 34
      w: 160
      h: 130
    motion: "pat"
    expression: "smile"
    texts:
      - "YO! RGB 故障通道已超频，一起炸翻枯燥的桌面吧 ⚡"
      - "别盯着我的 X 型义眼看，小心掉进赛博兔子洞！"
  - name: "body"
    label: "街头脉冲涂鸦"
    rect:
      x: 84
      y: 168
      w: 152
      h: 118
    motion: "happy"
    expression: "surprised"
    texts:
      - "DROP THE BEAT! 把文件砸过来，看我秒速拆解它的字节流！"
      - "右键召唤故障星盘，随时开启高能专注冲刺！"

drop_handlers:
  - extensions: ["*"]
    motion: "feed"
    expression: "smile"
    bubble_template: "💥 GLITCH BITE! 已撕裂并解析文件 [{filename}]！"
    action:
      type: "exec"
      command: "python"
      args: ["-c", "import sys, os; p=sys.argv[1]; sz=os.path.getsize(p); print(f'💥 [PULSE GLITCH] {os.path.basename(p)} // {sz} BYTES CRUSHED!')"]

menus:
  - id: "pulse_beat"
    label: "故障节拍"
    children:
      - id: "pulse_drop"
        label: "全息色散冲击"
        badge: "BEAT"
        action:
          type: "emit"
          app_id: "internal"
          event: "pet.quick_action"
          payload:
            motion: "happy"
            expression: "surprised"
            text: "💥 SYSTEM OVERLOAD // 赛博故障律动全开！"
      - id: "pulse_radar"
        label: "赛博雷达锁定"
        action:
          type: "emit"
          app_id: "internal"
          event: "pet.tactical_scan"
          payload: {}
      - id: "pulse_mute"
        label: "静默潜行待机"
        action:
          type: "emit"
          app_id: "internal"
          event: "pet.quick_action"
          payload:
            motion: "sleep"
            expression: "sleepy"
            text: "🎧 音频通道已切入 Lo-Fi 低功耗潜行模式..."
