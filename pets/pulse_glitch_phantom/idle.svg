<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340">
  <defs>
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="phantomCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glitchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="0" stdDeviation="1" flood-color="#06b6d4" flood-opacity="0.85" />
      <feDropShadow dx="4" dy="0" stdDeviation="1" flood-color="#f43f5e" flood-opacity="0.85" />
    </filter>
  </defs>

  <!-- Acid Pop Jagged Backdrop -->
  <polygon
    points="160,24 202,68 268,48 242,114 298,154 246,192 276,258 206,246 160,304 114,246 44,258 74,192 22,154 78,114 52,48 118,68"
    fill="none"
    stroke="url(#acidGrad)"
    stroke-width="2.5"
    stroke-dasharray="16 6 4 6"
    opacity="0.85"
  />

  <!-- Floating Glitch Slices -->
  <rect x="34" y="96" width="38" height="8" fill="#06b6d4" opacity="0.85" />
  <rect x="248" y="138" width="44" height="10" fill="#f43f5e" opacity="0.85" />
  <rect x="42" y="218" width="32" height="6" fill="#facc15" opacity="0.9" />

  <!-- Floating Neon Crown -->
  <polygon
    points="114,68 132,34 160,56 188,34 206,68"
    fill="#facc15"
    stroke="#18181b"
    stroke-width="3"
    filter="url(#glitchShadow)"
  />

  <!-- Main Glitch Phantom Cloak Body -->
  <path
    d="M84 156 C84 94, 116 68, 160 68 C204 68, 236 94, 236 156 L246 274 L214 252 L188 282 L160 254 L132 282 L106 252 L74 274 Z"
    fill="url(#phantomCore)"
    stroke="url(#acidGrad)"
    stroke-width="4"
    filter="url(#glitchShadow)"
  />

  <!-- Cyber Street Visor Glasses -->
  <polygon
    points="88,124 232,114 224,166 96,172"
    fill="#09090b"
    stroke="#facc15"
    stroke-width="3.5"
  />

  <!-- Asymmetric Acid Eyes (Left X-mark, Right Glowing Ring) -->
  <g stroke="#f43f5e" stroke-width="5" stroke-linecap="round">
    <line x1="114" y1="134" x2="142" y2="158" />
    <line x1="142" y1="134" x2="114" y2="158" />
  </g>
  <circle cx="190" cy="144" r="14" fill="none" stroke="#06b6d4" stroke-width="5" />
  <circle cx="190" cy="144" r="5" fill="#facc15" />

  <!-- Jagged Sawtooth Neon Mouth -->
  <polyline
    points="116,198 130,188 144,202 160,186 176,202 190,188 204,198"
    fill="none"
    stroke="#06b6d4"
    stroke-width="4"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Graffiti Spray Emblem on Chest -->
  <polygon points="154,214 142,236 162,236 152,256 180,230 160,230" fill="#f43f5e" />
</svg>
