    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: clocktower_shou_theme
  name: 守 (钟楼报时)
  primary: '#68e8b3'
  accent: '#7dd1f2'
  glow: rgba(104, 232, 179, 0.55)
  surface: rgba(25, 42, 35, 0.92)
  border: rgba(104, 232, 179, 0.6)
