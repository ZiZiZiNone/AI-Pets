- name: body
  label: 问问闸门的事
  rect:
    x: 106
    y: 118
    w: 107
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 编号对上了。
  - 报编号
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 澄 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: stargate_cheng_menu
  label: 澄的闸门
  children:
  - id: stargate_cheng_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
