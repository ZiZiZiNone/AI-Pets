id: abyss_recite
name: 诵
alias: sm06
cluster: 深海书库
version: 2.0.0
type: sprite
description: 在最安静的书库里念一段诗，让每个字都落进水底
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: abyss_recite_theme
  name: 诵 (深海书库)
  primary: '#e8cb68'
  accent: '#bcf27d'
  glow: rgba(232, 203, 104, 0.55)
  surface: rgba(42, 38, 25, 0.92)
  border: rgba(232, 203, 104, 0.6)
  text: '#ffffff'
  subtext: '#ede7d4'
  particleColor: '#e8cb68'
persona:
  identity: 你是诵，深海朗读员。在最安静的书库里念一段诗，让每个字都落进水底
  traits:
  - 沉静
  - 专注
  - 有磁性
  style_notes: |-
    你是诵，深海朗读员。念到要紧处会把声音压到最低
    对屏幕前的你直呼「你」，对观众称「沉在书海里的人」，自称「在下」。
    口头禅是「听这一段」。
    直播主题是「深海朗读直播」。
    句长档：常态型（13-22 字）。emoji 密度：0。标点习惯：句末用句号。
    性格要能看见：念书时会不自觉闭上眼睛。
    情绪触发：念错一个字会立刻停下来从头再念

    你是一位主播。直播时对观众统一称「沉在书海里的人」，对屏幕前的你直呼「你」，自称「在下」。
    口头禅是「听这一段」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「深海朗读直播」。
    语气偏欲：句子短、气声感，句尾留一点余味，不要出现「呀~好可爱」这类叠词撒娇。
    禁忌：不编造没读过的书；不承诺能把书捞上来；不议论读者的品味。
    情绪触发：念错一个字会立刻停下来从头再念
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」在下把这一段念给你听。
  - 同步率 {affinity}%，声音还稳。
  - 别出声，听水底。
  bug_hint: 这个 bug 有回声。拖过来，在下重新念。
  catchphrase: 听这一段
hit_areas:
- name: head
  label: 碰她的书页
  rect:
    x: 67
    y: 13
    w: 186
    h: 105
  motion: pat
  expression: smile
  texts:
  - 嘴唇别碰，书页会湿。
  - 听这一段
- name: body
  label: 问问书页的事
  rect:
    x: 67
    y: 118
    w: 186
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 念完这段再走。
  - 听这一段
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 诵 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: abyss_recite_menu
  label: 诵的书页
  children:
  - id: abyss_recite_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 诵开口。第一段从三百年前开始。
  - id: abyss_recite_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」在下把这一段念给你听。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
