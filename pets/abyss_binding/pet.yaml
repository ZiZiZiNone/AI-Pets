theme:
  id: abyss_binding_theme
  name: 蜃 (深海书库)
  primary: '#f3163b'
  accent: '#f2bc7d'
  glow: rgba(243, 22, 59, 0.55)
  surface: rgba(42, 25, 27, 0.92)
  border: rgba(243, 22, 59, 0.6)
