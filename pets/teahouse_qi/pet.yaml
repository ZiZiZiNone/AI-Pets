theme:
  id: teahouse_qi_theme
  name: 沏 (蒸汽茶馆)
  primary: '#eda745'
  accent: '#d1f27d'
  glow: rgba(237, 167, 69, 0.55)
  surface: rgba(42, 35, 25, 0.92)
  border: rgba(237, 167, 69, 0.6)
  text: '#ffffff'
  subtext: '#ede3d4'
