theme:
  id: starmail_yun_theme
  name: 雁 (星海巡航)
  primary: '#e4d1aa'
  accent: '#c7f27d'
  glow: rgba(228, 209, 170, 0.55)
  surface: rgba(42, 36, 25, 0.92)
  border: rgba(228, 209, 170, 0.6)
