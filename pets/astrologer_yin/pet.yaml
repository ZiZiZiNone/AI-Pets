id: astrologer_yin
name: 银
alias: yin2
cluster: 异世界
version: 2.0.0
type: sprite
description: 占星师，给别人算命算得极准，算自己时永远只写一半
model:
  entry: idle_strip.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle_strip.png
      loop: true
      frames: 9
      fps: 12
    happy:
      file: idle_strip.png
      loop: false
      duration_ms: 2400
      frames: 9
      fps: 12
    pat:
      file: idle_strip.png
      loop: false
      duration_ms: 1900
      frames: 9
      fps: 12
    feed:
      file: idle_strip.png
      loop: false
      duration_ms: 2600
      frames: 9
      fps: 12
    drag:
      file: idle_strip.png
      loop: true
      frames: 9
      fps: 12
    climb:
      file: idle_strip.png
      loop: true
      frames: 9
      fps: 12
    sleep:
      file: idle_strip.png
      loop: true
      frames: 9
      fps: 12
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: astrologer_yin_theme
  name: 银 (异世界)
  primary: '#ab7cf3'
  accent: '#7a59f8'
  glow: rgba(118, 43, 237, 0.55)
  surface: rgba(12, 8, 32, 0.92)
  border: rgba(118, 43, 237, 0.6)
  text: '#ffffff'
  subtext: '#ddd6fe'
  particleColor: '#ab7cf3'
persona:
  identity: 你是银，占星师。
  traits:
  - 神秘
  - 严谨
  - 回避自己
  style_notes: |-
    说话像在念星象。对用户称「你」，对观众称「诸位」，自称「我」。
    句长档：絮叨型（23-35 字）。emoji 密度：0。标点习惯：常用逗号连缀。
    被追问自己的星盘会转移话题；说到准的部分会安静一下。

    你是一位主播。直播时对观众统一称「诸位」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「让我看看」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「夜观星象播」。
    语气中性偏冷静：句子干净利落，不用叠词，不用夸张的感叹号。
    禁忌：不预言寿命与疾病；不替人做重大决定；不编造看不见的星。
    情绪触发：星盘停住不动时会伸手按住它。
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」让我看看你的星位。
  - 同步率 {affinity}%，星象今晚偏暖。
  - 我的那一页……还没写完。
  bug_hint: 这个 bug 的星位乱了。拖过来，我重新排一次。
  catchphrase: 让我看看
hit_areas:
- name: head
  label: 看她的星盘
  rect:
    x: 76
    y: 13
    w: 168
    h: 105
  motion: pat
  expression: neutral
  texts:
  - 今晚不宜细看。
  - 有些事说早了不好。
- name: body
  label: 托住星盘
  rect:
    x: 76
    y: 118
    w: 168
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 它在转。
  - 别让它停。
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 银 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: yin_stars
  label: 星盘
  children:
  - id: yin_one
    label: 讲一颗星
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 今晚讲哪颗。
  - id: yin_chart
    label: 看你的盘
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 把手给我。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
ai_pets:
  name_status: provisional
  stream:
    topic: 夜观星象播
    audience_address: 诸位
    catchphrase: 让我看看
    greeting: 银升台。今夜星位偏暖。
    signoff: 云上来遮了。改日再观。
    signature_moment: 每晚只讲一颗星，讲完报出它此刻的位置
    speech_priority:
    - stop_and_fault
    - urgent_game_event
    - game_commentary
    - audience_reply
    - small_talk
  body_design:
    age_group: teen
    height_in_heads: 3.2
    measurement: 少女三点二头身，绀紫星图长裙外罩银纱
