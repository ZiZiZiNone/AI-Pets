id: flyschool_xiao
name: 骁
alias: fhxiao
cluster: 飞行学院
version: 2.0.0
type: sprite
description: 蹲在观测坪上，把云跑的方向和风速都记在本子上
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: flyschool_xiao_theme
  name: 骁 (飞行学院)
  primary: '#d9f316'
  accent: '#93f27d'
  glow: rgba(217, 243, 22, 0.55)
  surface: rgba(40, 42, 25, 0.92)
  border: rgba(217, 243, 22, 0.6)
  text: '#ffffff'
  subtext: '#eaedd4'
