  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: clocktower_chui_theme
  name: 锤 (钟楼报时)
  primary: '#45a7ed'
  accent: '#8b7df2'
  glow: rgba(69, 167, 237, 0.55)
  surface: rgba(25, 35, 42, 0.92)
  border: rgba(69, 167, 237, 0.6)
