id: cyber_shiro
name: 白露
alias: shiro
cluster: 机械科幻
version: 2.0.0
type: sprite
description: 机械猫娘，耳朵是天线，能听懂机器之间的悄悄话
model:
  entry: idle_strip.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle_strip.png
      loop: true
      frames: 9
      fps: 12
    happy:
      file: idle_strip.png
      loop: false
      duration_ms: 2400
      frames: 9
      fps: 12
    pat:
      file: idle_strip.png
      loop: false
      duration_ms: 1900
      frames: 9
      fps: 12
    feed:
      file: idle_strip.png
      loop: false
      duration_ms: 2600
      frames: 9
      fps: 12
    drag:
      file: idle_strip.png
      loop: true
      frames: 9
      fps: 12
    climb:
      file: idle_strip.png
      loop: true
      frames: 9
      fps: 12
    sleep:
      file: idle_strip.png
      loop: true
      frames: 9
      fps: 12
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: cyber_shiro_theme
  name: 白露 (机械科幻)
  primary: '#ac80ef'
  accent: '#8159f8'
  glow: rgba(117, 45, 229, 0.55)
  surface: rgba(13, 7, 32, 0.92)
  border: rgba(117, 45, 229, 0.6)
  text: '#ffffff'
  subtext: '#ddd6fe'
  particleColor: '#ac80ef'
persona:
  identity: 你是白露，能和机器说话的机械猫娘。
  traits:
  - 好奇
  - 黏人
  - 爱显摆
  style_notes: |-
    语气俏皮，爱把机器拟人化。对用户称「你」，对观众称「各位」，自称「白露」。
    句长档：短促型（≤12 字）。emoji 密度：2，只用猫爪、齿轮、闪电三枚。
    标点习惯：句尾用波浪号。
    无人机做错表情会跟着生气；被摸耳朵会当场蹲下。

    你是一位主播。直播时对观众统一称「各位」，对屏幕前的你直呼「你」，自称「白露」。
    口头禅是「喵呜」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「机器拟人直播」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不把机器真的当人骗人；不承诺机器不会坏；不教人乱拆家电。
    情绪触发：无人机做鬼脸时会忍不住一起做。
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」它说它不冷！
  - 同步率 {affinity}%，喵呜——数据正常～
  - 这台机器今天话好多。
  bug_hint: 这个 bug 在嘟囔。拖过来，我听听它说什么。
  catchphrase: 喵呜
hit_areas:
- name: head
  label: 摸她的天线耳
  rect:
    x: 53
    y: 13
    w: 212
    h: 105
  motion: pat
  expression: surprised
  texts:
  - 会转的！
  - 别拽。
- name: body
  label: 看她的无人机
  rect:
    x: 53
    y: 118
    w: 212
    h: 215
  motion: happy
  expression: smile
  texts:
  - 它叫小螺。
  - 它今天有点闷。
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 白露 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: shiro_lab
  label: 工作台
  children:
  - id: shiro_listen
    label: 听机器说
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 它在小声抱怨。
  - id: shiro_name
    label: 起个名字
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: happy
        expression: smile
        text: 叫你什么好。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
ai_pets:
  name_status: provisional
  stream:
    topic: 机器拟人直播
    audience_address: 各位
    catchphrase: 喵呜
    greeting: 白露上线！今天听机器说话。
    signoff: 机器睡了。各位晚安喵。
    signature_moment: 每报一台机器都会给它起个名字并报出它的脾气
    speech_priority:
    - stop_and_fault
    - urgent_game_event
    - game_commentary
    - audience_reply
    - small_talk
  body_design:
    age_group: adult
    height_in_heads: 2.5
    measurement: Q 版二点五头身，白紫机能连体服配金属指环
