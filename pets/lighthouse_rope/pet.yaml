theme:
  id: lighthouse_rope_theme
  name: 缆 (灯塔守望)
  primary: '#cfe868'
  accent: '#89f27d'
  glow: rgba(207, 232, 104, 0.55)
  surface: rgba(38, 42, 25, 0.92)
