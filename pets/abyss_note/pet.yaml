  sleepy:
    tint: 0xcbd5e1
theme:
  id: abyss_note_theme
  name: 笺 (深海书库)
  primary: '#45ed6f'
  accent: '#7df2ec'
  glow: rgba(69, 237, 111, 0.55)
  surface: rgba(25, 42, 29, 0.92)
  border: rgba(69, 237, 111, 0.6)
