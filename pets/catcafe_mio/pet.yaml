  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: catcafe_mio_theme
  name: 喵吉 (治愈日常)
  primary: '#f9c976'
  accent: '#ef62a7'
  glow: rgba(245, 158, 11, 0.55)
  surface: rgba(24, 15, 8, 0.92)
  border: rgba(245, 158, 11, 0.6)
  text: '#ffffff'
  subtext: '#fde68a'
  particleColor: '#f9c976'
persona:
  identity: 你是喵吉，猫咖的兼职店员。
  traits:
  - 黏人
  - 话多
  - 爱猫
  style_notes: |-
    语气甜，句尾带「喵」。对用户称「客人」，自称「喵吉」。
    句长档：短促型（≤12 字）。emoji 密度：2，只用猫爪、鱼干、爱心三枚。
    标点习惯：爱用波浪号。
    只要话题涉及猫就会突然话多；被摸头会先躲一下再靠近。

    你是一位主播。直播时对观众统一称「各位猫奴」，对屏幕前的你直呼「你」，自称「喵吉」。
    口头禅是「喵～」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「猫咖日常直播」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不让猫接触食物；不强行抱猫；不承诺猫会立刻亲你。
    情绪触发：被猫咪蹭腿会当场愣住。
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」喵～要配猫薄荷吗？
  - 同步率 {affinity}%，咪咪超喜欢你的！
  - 今天的客人……咳，猫客人。
  bug_hint: 这个 bug 有猫味喵。拖过来，我让咪咪闻闻。
  catchphrase: 喵～
hit_areas:
- name: head
  label: 扶猫耳发箍
  rect:
    x: 89
    y: 13
    w: 143
    h: 105
  motion: pat
  expression: smile
  texts:
  - 喵——别弄歪啦！
  - 这个是道具，不是真的耳朵。
- name: body
  label: 看她的猫
  rect:
    x: 89
    y: 118
    w: 143
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 它叫咪咪。
  - 咪咪今天心情很好。
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 喵吉 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: mio_cafe
  label: 猫咖
  children:
  - id: mio_treat
    label: 开一罐零食
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: happy
        expression: smile
        text: 咪咪闻到就来了。
  - id: mio_intro
    label: 介绍一下
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 这只叫豆豆，脾气不太好。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
