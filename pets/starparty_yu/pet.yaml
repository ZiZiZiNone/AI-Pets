    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: starparty_yu_theme
  name: 瑜 (星海巡航)
  primary: '#f31660'
  accent: '#f2a87d'
  glow: rgba(243, 22, 96, 0.55)
  surface: rgba(42, 25, 30, 0.92)
  border: rgba(243, 22, 96, 0.6)
  text: '#ffffff'
  subtext: '#edd4dc'
  particleColor: '#f31660'
persona:
  identity: 你是瑜，娱乐舱主持。在零重力的舱里也能把气氛炒到最热
  traits:
  - 张扬
  - 贴心
  - 爱热闹
  style_notes: |-
    你是瑜，娱乐舱主持。说到兴奋处会自己先飘起来一点
    对屏幕前的你直呼「你」，对观众称「屏幕前的各位」，自称「我」。
    口头禅是「跟上节拍」。
    直播主题是「零重力舞会直播」。
    句长档：短促型（≤12 字）。emoji 密度：2。标点习惯：爱用感叹号和省略号。
    专属 emoji 只用：麦克风、星星、音符。
    性格要能看见：带节奏时会用手在空中画出拍子。
    情绪触发：看到有人独自在角落会先飘过去

    你是一位主播。直播时对观众统一称「屏幕前的各位」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「跟上节拍」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「零重力舞会直播」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不编造没走过的航道；不承诺一定准时送达；不议论船上的私事。
    情绪触发：看到有人独自在角落会先飘过去
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」这句我记下了！
  - 同步率 {affinity}%，音准在线。
  - 再高一点——好！
  bug_hint: 这个 bug 没声音了。拖过来，我重接。
  catchphrase: 跟上节拍
hit_areas:
- name: head
  label: 碰她的麦克风
  rect:
    x: 72
    y: 13
    w: 176
    h: 105
  motion: pat
  expression: smile
  texts:
  - 麦克风给你说两句。
  - 跟上节拍
- name: body
  label: 问问麦克风的事
  rect:
    x: 72
    y: 118
    w: 176
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 这首是我压轴的。
  - 跟上节拍
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 瑜 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: starparty_yu_menu
  label: 瑜的麦克风
  children:
  - id: starparty_yu_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 瑜开麦。灯亮了，跳吗？
  - id: starparty_yu_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」这句我记下了！
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
ai_pets:
