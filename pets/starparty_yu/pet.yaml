  stream:
    topic: 零重力舞会直播
    audience_address: 屏幕前的各位
    catchphrase: 跟上节拍
    greeting: 瑜开麦。灯亮了，跳吗？
    signoff: 灯灭。各位晚安。
    signature_moment: 每首歌开始前会报一次今天的漂浮高度
