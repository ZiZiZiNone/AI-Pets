  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: dessert_sundae_theme
  name: 淇 (甜点工坊)
  primary: '#45dfed'
  accent: '#7d96f2'
  glow: rgba(69, 223, 237, 0.55)
  surface: rgba(25, 40, 42, 0.92)
  border: rgba(69, 223, 237, 0.6)
