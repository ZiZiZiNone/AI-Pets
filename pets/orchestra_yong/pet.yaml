  name: 咏 (交响乐团)
  primary: '#e868cf'
  accent: '#f27d89'
  glow: rgba(232, 104, 207, 0.55)
  surface: rgba(42, 25, 38, 0.92)
  border: rgba(232, 104, 207, 0.6)
