id: "aether_mecha_core"
name: "AETHER-VII 战术浮游核心"
version: "2.0.0"
type: "sprite"
description: "搭载双轨陀螺仪星环、等离子追踪视觉与反重力浮游翼的跨时代战术机甲核心"

model:
  entry: "idle.svg"
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: "idle.svg"
      loop: true
    happy:
      file: "idle.svg"
      loop: false
      duration_ms: 2400
    pat:
      file: "idle.svg"
      loop: false
      duration_ms: 1900
    feed:
      file: "idle.svg"
      loop: false
      duration_ms: 2600
    drag:
      file: "idle.svg"
      loop: true
    climb:
      file: "idle.svg"
      loop: true
    sleep:
      file: "idle.svg"
      loop: true

expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xa5f3fc
  surprised:
    tint: 0xfda4af
  sleepy:
    tint: 0x94a3b8

hit_areas:
  - name: "head"
    label: "V型雷达天线校准"
    rect:
      x: 80
      y: 28
      w: 160
      h: 118
    motion: "pat"
    expression: "smile"
    texts:
      - "[AETHER-VII] 神经突触同步率 99.8%，全息战术视野已锁定。"
      - "光学传感器校准完毕，随时准备接管外部进程流。"
      - "检测到指挥官手部接触——推进器输出功率提升 15% ⚡"
  - name: "body"
    label: "反应堆过载脉冲"
    rect:
      x: 84
      y: 148
      w: 152
      h: 125
    motion: "happy"
    expression: "surprised"
    texts:
      - "核心反应堆运转正常！右键展开【双轨陀螺仪战术翼】下达指令。"
      - "把任意脚本或源码拖入我的引力场，即可启动吞噬解析引擎！"
      - "伴生神经突触舱已就绪，支持自由拖拽模块节点。"

drop_handlers:
  - extensions: [".py", ".rs", ".ts", ".js", ".vue", ".json", ".yaml", ".yml", ".md", ".txt"]
    motion: "feed"
    expression: "smile"
    bubble_template: "⚡ 引力场捕获源码矩阵 [{filename}]，正在注入量子解析核心..."
    action:
      type: "exec"
      command: "python"
      args: ["-c", "import sys, os; p=sys.argv[1]; sz=os.path.getsize(p); lines=sum(1 for _ in open(p, 'rb')); print(f'[AETHER 解析报告] {os.path.basename(p)} -> 共 {lines} 行代码 / {sz} Bytes 载荷 ✨')"]
  - extensions: ["*"]
    motion: "feed"
    expression: "surprised"
    bubble_template: "⚡ 已将外部载荷 [{filename}] 广播至全体热插拔节点！"
    action:
      type: "emit"
      app_id: "broadcast"
      event: "pet.file_dropped"
      payload: {}

menus:
  - id: "aether_tactical"
    label: "战术核心"
    icon: "💠"
    children:
      - id: "aether_overdrive"
        label: "开启过载脉冲"
        icon: "⚡"
        badge: "OVERDRIVE"
        action:
          type: "emit"
          app_id: "internal"
          event: "pet.quick_action"
          payload:
            motion: "happy"
            expression: "smile"
            text: "[OVERDRIVE] 反重力浮游翼全功率展开！全屏 AR 雷达待命中。"
      - id: "aether_scan_hud"
        label: "全屏战术扫描"
        icon: "🎯"
        action:
          type: "emit"
          app_id: "internal"
          event: "pet.tactical_scan"
          payload: {}
      - id: "aether_stealth"
        label: "休眠隐匿模式"
        icon: "🌙"
        action:
          type: "emit"
          app_id: "internal"
          event: "pet.quick_action"
          payload:
            motion: "sleep"
            expression: "sleepy"
            text: "[STEALTH] 光学迷彩与低功耗待机已激活（24FPS 节能巡航）..."
