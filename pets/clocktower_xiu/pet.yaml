  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: clocktower_xiu_theme
  name: 修 (钟楼报时)
  primary: '#ed457d'
  accent: '#f2a87d'
  glow: rgba(237, 69, 125, 0.55)
  surface: rgba(42, 25, 30, 0.92)
