theme:
  id: apothecary_ya_theme
  name: 芽 (雨林药圃)
  primary: '#e8d768'
  accent: '#b0f27d'
  glow: rgba(232, 215, 104, 0.55)
  surface: rgba(42, 39, 25, 0.92)
  border: rgba(232, 215, 104, 0.6)
