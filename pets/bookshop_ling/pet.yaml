theme:
  id: bookshop_ling_theme
  name: 朗 (旧书店)
  primary: '#f33716'
  accent: '#f2e17d'
  glow: rgba(243, 55, 22, 0.55)
  surface: rgba(42, 27, 25, 0.92)
  border: rgba(243, 55, 22, 0.6)
  text: '#ffffff'
  subtext: '#edd7d4'
