- name: body
  label: 问问药秤的事
  rect:
    x: 100
    y: 116
    w: 128
    h: 212
  motion: happy
  expression: surprised
  texts:
  - 秤是好秤，三十年没有偏过。
  - 先说症状
drop_handlers:
- extensions:
