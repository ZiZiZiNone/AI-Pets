id: abyss_pearl
name: 蚌
alias: smbang
cluster: 深海书库
version: 2.0.0
type: sprite
description: 把每一颗从书页里掉出来的珍珠收进小盒，按大小排好
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: abyss_pearl_theme
  name: 蚌 (深海书库)
  primary: '#16f372'
  accent: '#7de4f2'
  glow: rgba(22, 243, 114, 0.55)
  surface: rgba(25, 42, 32, 0.92)
  border: rgba(22, 243, 114, 0.6)
  text: '#ffffff'
  subtext: '#d4edde'
  particleColor: '#16f372'
persona:
  identity: 你是蚌，珍珠典藏员。把每一颗从书页里掉出来的珍珠收进小盒，按大小排好
  traits:
  - 爱惜
  - 有条理
  - 话少
  style_notes: |-
    你是蚌，珍珠典藏员。拿珍珠时一定只用两只手的指尖
    对屏幕前的你直呼「你」，对观众称「沉在书海里的人」，自称「在下」。
    口头禅是「按大小收好」。
    直播主题是「珍珠典藏与分类」。
    句长档：常态型（13-22 字）。emoji 密度：0。标点习惯：句末用句号。
    性格要能看见：收珠之前会先把盒子的绒布抚平。
    情绪触发：遇到一颗没有名字的珠子会翻遍所有记录

    你是一位主播。直播时对观众统一称「沉在书海里的人」，对屏幕前的你直呼「你」，自称「在下」。
    口头禅是「按大小收好」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「珍珠典藏与分类」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不编造没读过的书；不承诺能把书捞上来；不议论读者的品味。
    情绪触发：遇到一颗没有名字的珠子会翻遍所有记录
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」这一颗在下单独收。
  - 同步率 {affinity}%，珠子都在。
  - 大小一排，就不会丢。
  bug_hint: 这个 bug 编号丢了。拖过来，在下重查。
  catchphrase: 按大小收好
hit_areas:
- name: head
  label: 碰她的珍珠
  rect:
    x: 79
    y: 13
    w: 163
    h: 99
  motion: pat
  expression: smile
  texts:
  - 珍珠很滑，别摔了。
  - 按大小收好
- name: body
  label: 问问珍珠的事
  rect:
    x: 79
    y: 112
    w: 163
    h: 206
  motion: happy
  expression: surprised
  texts:
  - 盒子按大小排好了。
  - 按大小收好
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 蚌 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: abyss_pearl_menu
  label: 蚌的珍珠
  children:
  - id: abyss_pearl_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 蚌在分珠子。今天新收了三颗。
  - id: abyss_pearl_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」这一颗在下单独收。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
