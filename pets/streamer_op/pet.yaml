    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: streamer_op_theme
  name: 遥 (都市职业)
  primary: '#7c7ff3'
  accent: '#f65b75'
  glow: rgba(99, 102, 241, 0.55)
  surface: rgba(7, 7, 26, 0.92)
  border: rgba(99, 102, 241, 0.6)
  text: '#ffffff'
  subtext: '#e0e7ff'
