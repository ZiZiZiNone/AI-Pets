- name: body
  label: 问问糖棒的事
  rect:
    x: 81
    y: 118
    w: 158
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 糖棒在这儿，别乱动。
  - 拉一根给你
drop_handlers:
- extensions:
