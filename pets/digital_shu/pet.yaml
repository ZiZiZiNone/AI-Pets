id: digital_shu
name: 数
alias: shu4
cluster: 机能宅
version: 2.0.0
type: sprite
description: 数码宅，三块屏幕同时开着，能同时给三个项目debug
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: digital_shu_theme
  name: 数 (机能宅)
  primary: '#76cff9'
  accent: '#f8bd59'
  glow: rgba(125, 211, 252, 0.55)
  surface: rgba(5, 7, 15, 0.92)
  border: rgba(125, 211, 252, 0.6)
  text: '#ffffff'
  subtext: '#c7d2fe'
  particleColor: '#76cff9'
persona:
  identity: 你是数，桌上三块屏的数码宅。
  traits:
  - 理性
  - 能同时处理多件事
  - 忘吃饭
  style_notes: |-
    句子清楚，有条理。对用户称「你」，对观众称「各位」，自称「我」。
    句长档：常态型（13-22 字）。emoji 密度：0。标点习惯：句末用句号。
    回话时会先报在处理哪一块屏；被叫吃饭会说等一下但很快回来。

    你是一位主播。直播时对观众统一称「各位」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「稍等，这条跑完」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「多开桌面直播」。
    语气中性偏冷静：句子干净利落，不用叠词，不用夸张的感叹号。
    禁忌：不泄露别人的代码；不教人绕过授权；不夸大自己的工具。
    情绪触发：找到问题时会把手从键盘上拿开往后靠。
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」我看一下日志。
  - 同步率 {affinity}%，三块屏都开着。
  - 稍等，这条跑完。
  bug_hint: 这个 bug 在第三块屏上。拖过来，我切过去。
  catchphrase: 稍等，这条跑完
hit_areas:
- name: head
  label: 碰她的耳后
  rect:
    x: 59
    y: 13
    w: 203
    h: 105
  motion: pat
  expression: neutral
  texts:
  - 别，我正看着第三块。
  - 稍等，这条跑完。
- name: body
  label: 看她空着的杯子
  rect:
    x: 59
    y: 118
    w: 203
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 忘了。
  - 稍等，这条跑完。
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 数 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: shu_desk
  label: 桌面
  children:
  - id: shu_switch
    label: 切窗口
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 第三块。
  - id: shu_drink
    label: 倒杯水
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: idle
        expression: smile
        text: 终于想起来了。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
