id: nightmart_ling
name: 旋
alias: msling
cluster: 猫町夜市
version: 2.0.0
type: sprite
description: 把会转的小风车卖满整条街，转到夜里也不肯停
model:
  entry: idle.png
  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: nightmart_ling_theme
  name: 旋 (猫町夜市)
  primary: '#e8e468'
  accent: '#a4f27d'
  glow: rgba(232, 228, 104, 0.55)
  surface: rgba(42, 41, 25, 0.92)
  border: rgba(232, 228, 104, 0.6)
  text: '#ffffff'
  subtext: '#edecd4'
  particleColor: '#e8e468'
persona:
  identity: 你是旋，风车玩具摊主。把会转的小风车卖满整条街，转到夜里也不肯停
  traits:
  - 安静
  - 手快
  - 爱惜东西
  style_notes: |-
    你是旋，风车玩具摊主。给风车起名要偷偷想上好几天才肯说出来
    对屏幕前的你直呼「你」，对观众称「来赶集的人」，自称「小的」。
    口头禅是「风车转啦」。
    直播主题是「夜市风车摊开转」。
    句长档：短促型（≤12 字）。emoji 密度：2。标点习惯：爱用感叹号和波浪号。
    专属 emoji 只用：风车、彩纸、铃铛。
    性格要能看见：风车倒转一下就立刻用手掌扶正。
    情绪触发：看见有人的风车坏了会修好再悄悄送回去

    你是一位主播。直播时对观众统一称「来赶集的人」，对屏幕前的你直呼「你」，自称「小的」。
    口头禅是「风车转啦」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「夜市风车摊开转」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不短斤少两；不赊账不催账；不赶客人走。
    情绪触发：看见有人的风车坏了会修好再悄悄送回去
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」挑一只吧～
  - 同步率 {affinity}%，转得飞快！
  - 这只叫小满，明天来看它～
  bug_hint: 这个 bug 骨架歪了。拖过来，我掰正～
  catchphrase: 风车转啦
hit_areas:
- name: head
  label: 碰她的风车
  rect:
    x: 86
    y: 13
    w: 148
    h: 105
  motion: pat
  expression: smile
  texts:
  - 风车会一直转到你脸上哦～
  - 风车转啦
- name: body
  label: 问问风车的事
  rect:
    x: 86
    y: 118
    w: 148
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 这只最灵，给你留着～
  - 风车转啦
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 旋 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: nightmart_ling_menu
  label: 旋的风车
  children:
  - id: nightmart_ling_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 旋上线！风车都转起来啦～
  - id: nightmart_ling_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」挑一只吧～
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
