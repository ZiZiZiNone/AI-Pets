theme:
  id: abyss_foam_theme
  name: 沫 (深海书库)
  primary: '#d1e4aa'
  accent: '#7df281'
  glow: rgba(209, 228, 170, 0.55)
  surface: rgba(36, 42, 25, 0.92)
