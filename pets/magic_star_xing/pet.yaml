theme:
  id: magic_star_xing_theme
  name: 占 (魔法学院)
  primary: '#45b5ed'
  accent: '#817df2'
  glow: rgba(69, 181, 237, 0.55)
  surface: rgba(25, 36, 42, 0.92)
