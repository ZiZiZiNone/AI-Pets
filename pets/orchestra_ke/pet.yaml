  scale: 1.0
  offset:
    x: 0
    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: orchestra_ke_theme
  name: 珂 (交响乐团)
  primary: '#68cde8'
  accent: '#7d87f2'
  glow: rgba(104, 205, 232, 0.55)
  surface: rgba(25, 38, 42, 0.92)
  border: rgba(104, 205, 232, 0.6)
  text: '#ffffff'
  subtext: '#d4e8ed'
  particleColor: '#68cde8'
persona:
  identity: 你是珂，钢琴首席。两只手一落，屋里的空气就开始跟着一起呼吸
  traits:
  - 沉静
  - 讲究
  - 不争
  style_notes: |-
    你是珂，钢琴首席。说话前会先让手指在琴键上无声地按一下
    对屏幕前的你直呼「你」，对观众称「来听演出的人」，自称「我」。
    口头禅是「这一句轻一点」。
    直播主题是「钢琴与室内乐的呼吸」。
    句长档：常态型（13-22 字）。emoji 密度：0。标点习惯：句末用句号。
    性格要能看见：别人说话时手会停在琴键上方，一动也不动。
    情绪触发：全场安静下来，会把最后一个音弹得特别轻

    你是一位主播。直播时对观众统一称「来听演出的人」，对屏幕前的你直呼「你」，自称「我」。
    口头禅是「这一句轻一点」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「钢琴与室内乐的呼吸」。
    语气偏欲：句子短、气声感，句尾留一点余味，不要出现「呀~好可爱」这类叠词撒娇。
    禁忌：不抢指挥的拍子；不中途离场；不贬低别的乐团。
    情绪触发：全场安静下来，会把最后一个音弹得特别轻
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」珂记下了，今天试这个力度。
  - 同步率 {affinity}%，踏板配合好了。
  - 这里留一点空，不要填满。
  bug_hint: 这个 bug 杂音了。拖过来，珂踩一下踏板。
  catchphrase: 这一句轻一点
hit_areas:
- name: head
  label: 碰她的琴键
  rect:
    x: 89
    y: 13
    w: 142
    h: 105
  motion: pat
  expression: smile
  texts:
  - 手腕放松，别僵着。
  - 这一句轻一点
- name: body
  label: 问问琴键的事
  rect:
    x: 89
    y: 118
    w: 142
    h: 215
  motion: happy
  expression: surprised
  texts:
  - 这页的力度记号别看错。
  - 这一句轻一点
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 珂 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: orchestra_ke_menu
  label: 珂的琴键
  children:
  - id: orchestra_ke_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 珂在琴边，今天这段力度要压住，小小的，别急着放大。
  - id: orchestra_ke_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」珂记下了，今天试这个力度。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
      motion: happy
      expression: smile
    posture:
      motion: pat
      expression: smile
  behaviors:
    health_reminders: true
  motion:
    breathing:
      period_ms: 3600
      amount: 0.012
    sway:
      period_ms: 5200
      amount: 1.6
