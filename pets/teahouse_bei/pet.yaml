  stream:
    topic: 蒸笼里的现做茶点
    audience_address: 进来喝一杯的人
    catchphrase: 刚出笼的
    greeting: 焙在笼边守着，刚起锅的一笼端给各位，先尝。
    signoff: 笼子收了，甜点留在盘里，各位慢用。
    signature_moment: 每笼点心都会报一遍馅料，报完才让人动筷
