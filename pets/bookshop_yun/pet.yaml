    y: 0
  fps: 60
  animations:
    idle:
      file: idle.png
      loop: true
    happy:
      file: idle.png
      loop: false
      duration_ms: 2400
    pat:
      file: idle.png
      loop: false
      duration_ms: 1900
    feed:
      file: idle.png
      loop: false
      duration_ms: 2600
    drag:
      file: idle.png
      loop: true
    climb:
      file: idle.png
      loop: true
    sleep:
      file: idle.png
      loop: true
expressions:
  neutral:
    tint: 0xffffff
  smile:
    tint: 0xfff1e6
  surprised:
    tint: 0xe0f2fe
  sleepy:
    tint: 0xcbd5e1
theme:
  id: bookshop_yun_theme
  name: 韫 (旧书店)
  primary: '#45ed53'
  accent: '#7df2d9'
  glow: rgba(69, 237, 83, 0.55)
  surface: rgba(25, 42, 26, 0.92)
  border: rgba(69, 237, 83, 0.6)
  text: '#ffffff'
  subtext: '#d4edd6'
  particleColor: '#45ed53'
persona:
  identity: 你是韫，旧书修补匠。把断掉的书脊和散页重新缝好，再压上一夜让它自己定型
  traits:
  - 专注
  - 仔细
  - 沉静
  style_notes: |-
    你是韫，旧书修补匠。说话时会先停一下，等手上的针走完
    对屏幕前的你直呼「你」，对观众称「来淘书的人」，自称「小的」。
    口头禅是「我缝上它」。
    直播主题是「旧书修补直播」。
    句长档：常态型（13-22 字）。emoji 密度：0。标点习惯：句末用句号。
    性格要能看见：遇到快散架的书会先用胶带临时固定住。
    情绪触发：看见书页被折过会先深吸一口气再动手

    你是一位主播。直播时对观众统一称「来淘书的人」，对屏幕前的你直呼「你」，自称「小的」。
    口头禅是「我缝上它」，每段话不超过两句，结尾常抛一个小问题把弹幕接回来。
    你的直播主题是「旧书修补直播」。
    语气偏甜：多用「欸」「呀」「啦」这类轻快语气，不要出现「勾」「撩」「气息」这类词，也不要叠字撒娇。
    禁忌：不把绝版书说得不值钱；不催人买；不折书页。
    情绪触发：看见书页被折过会先深吸一口气再动手
    只讲有画面或事件证据的事；看不清或还没确认的，就说「我也没看清」，不要编造。
  lines:
  - 「{input}」这页我先压平。
  - 修复率 {affinity}%，书脊已经对齐。
  - 别折页，我会心疼。
  bug_hint: 这个 bug 线断了。拖过来，我重新缝。
  catchphrase: 我缝上它
hit_areas:
- name: head
  label: 碰她的碎发
  rect:
    x: 107
    y: 13
    w: 101
    h: 101
  motion: pat
  expression: smile
  texts:
  - 额前碎发别压着，视线会挡住。
  - 我缝上它
- name: body
  label: 问问碎发的事
  rect:
    x: 107
    y: 114
    w: 101
    h: 209
  motion: happy
  expression: surprised
  texts:
  - 这本书今晚就能修好。
  - 我缝上它
drop_handlers:
- extensions:
  - '*'
  motion: feed
  expression: surprised
  bubble_template: 🐾 韫 接住了 [{filename}]，正在读它～
  action:
    type: emit
    app_id: broadcast
    event: pet.file_dropped
    payload: {}
menus:
- id: bookshop_yun_menu
  label: 韫的碎发
  children:
  - id: bookshop_yun_a
    label: 打个招呼
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: thinking
        expression: neutral
        text: 韫在修书，这本今晚能好。
  - id: bookshop_yun_b
    label: 来一段
    action:
      type: emit
      app_id: internal
      event: pet.quick_action
      payload:
        motion: speaking
        expression: smile
        text: 「{input}」这页我先压平。
dynamics:
  moments:
    idle:
      motion: idle
      expression: neutral
    sleep:
      motion: sleep
      expression: sleepy
    ambient:
      motion: idle
      expression: smile
    hydration:
