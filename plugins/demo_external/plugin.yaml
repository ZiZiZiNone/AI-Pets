# 示例外部插件：只发描述，不自己画界面。
#
# 权限只申请它真用得上的两项。宿主的清单格式里 permissions 只是一串权限名，申请理由写
# 在每一项上面那行注释里——注释宿主会忽略，但人看得见，doctor 与夹具也会读出来。
id: demo_external
name: 外部示例插件 · 提示气泡
version: 1.0.0
description: 往桌宠气泡和 HUD 上放一条外部说明，用来验证插件体系是否打通。
permissions:
  # 把一句外部提示交给桌宠的气泡显示——只给文字，界面由宿主画。
  - pet:speak
  # 给出一条 HUD 标注的位置与文字，由宿主画成矩形和标签。
  - hud:draw
